name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race detector)
        run: go test -race ./...

  container:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t aethel-ledger:ci .
      - name: Container starts and listens on PORT
        run: |
          docker run -d --name ledger -e PORT=8080 aethel-ledger:ci
          sleep 5
          docker logs ledger
          docker logs ledger 2>&1 | grep -q 'addr=:8080'
          docker rm -f ledger
