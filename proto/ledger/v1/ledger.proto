syntax = "proto3";

package ledger.v1;

option go_package = "github.com/Kunal-svg-cyber/aethel-ledger/internal/genproto/ledger/v1;ledgerv1";

// LedgerService is the gRPC front door to the Aethel Ledger engine.
// Every mutating call goes through the sharded-lock engine built in
// week 1-2 before returning to the caller.
service LedgerService {
  // Deposit credits an account. Creates the account on first touch.
  rpc Deposit(DepositRequest) returns (DepositResponse);

  // Transfer atomically moves funds between two accounts using the
  // engine's deterministic lock-ordered Transfer(). Requires an
  // idempotency_key so retried requests (e.g. from a flaky client or
  // load balancer) are never applied twice — see week 3-4's
  // idempotency layer, which sits in front of this call.
  rpc Transfer(TransferRequest) returns (TransferResponse);

  // GetBalance reads the current balance of an account. Returns 0 for
  // an account that has never been touched, not an error — an
  // untouched account is a valid, well-defined state in this ledger.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message DepositRequest {
  string account_id = 1;
  int64 amount = 2; // integer minor units (e.g. cents). Must be > 0.
}

message DepositResponse {
  string account_id = 1;
  int64 balance = 2; // resulting balance after the deposit
}

message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  int64 amount = 3; // integer minor units. Must be > 0.

  // idempotency_key is generated by the CLIENT and must be a unique
  // identifier for this specific transfer intent (e.g. a UUID minted
  // once per user action, reused on every retry of that same action).
  // The server rejects a second Transfer carrying a key it has already
  // committed, so network retries can never double-spend.
  string idempotency_key = 4;
}

message TransferResponse {
  string from_account_id = 1;
  string to_account_id = 2;
  int64 from_balance = 3; // resulting sender balance
  int64 to_balance = 4;   // resulting recipient balance
  bool replayed = 5;      // true if this idempotency_key was already
                           // committed and this response is a replay of
                           // the original result, not a new mutation
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string account_id = 1;
  int64 balance = 2;
}
